# /etc/rsyslog.d/90-ama-forwarders.conf  (Linux SOURCE hosts - RECOMMENDED)
#
# Requires the rsyslog-relp package on this host and imrelp on the forwarders
# (see ../forwarder/rsyslog/00-ama-fwd-inputs.conf).
#
# Why RELP: plain TCP syslog has no application acknowledgement. When a
# forwarder dies without closing its connections (power loss, kernel panic),
# whatever this host already wrote into the dead socket is silently lost.
# In a lab test (node crash, VIP moved after 4 s, 400 msg/s) plain TCP lost
# ~6 s of messages; RELP lost none, because it resends unacknowledged
# messages on the new connection.
#
# Failover comes from the VIP (keepalived moves it off a failed node).
# Balance load by pointing half of your hosts at VIP-A and half at VIP-B.

module(load="omrelp")

action(
    name="fwd_ama_relp"
    type="omrelp"
    target="10.10.20.21"                  # VIP-A (or VIP-B for the other half)
    port="2514"
    # No template override: AMA re-renders the header on the forwarder as RFC 3164
    # (no UTC offset) and interprets it in the FORWARDER's time zone, so keep
    # sources and forwarders in the same zone - ideally all UTC.

    queue.type="LinkedList"
    queue.filename="fwd_ama_relp"
    queue.size="100000"
    queue.maxDiskSpace="2g"
    queue.saveOnShutdown="on"
    action.resumeRetryCount="-1"
    action.resumeInterval="10"
)
