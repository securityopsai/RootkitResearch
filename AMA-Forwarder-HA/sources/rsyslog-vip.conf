# /etc/rsyslog.d/90-ama-forwarders.conf  (Linux SOURCE hosts, any rsyslog v8)
#
# For rsyslog older than 8.2408.0 (no target pools). Failover is done by the
# VIP: when keepalived moves it, this host's next send hits a node with no
# session, gets a TCP reset, and reconnects. The disk-assisted queue holds
# messages while the connection is re-established.
#
# Balance load by pointing half of your hosts at VIP-A and half at VIP-B.

action(
    name="fwd_ama"
    type="omfwd"
    target="10.10.20.21"                  # VIP-A (or VIP-B for the other half)
    port="514"
    protocol="tcp"
    # No template override: AMA re-renders the header on the forwarder as RFC 3164
    # (no UTC offset) and interprets it in the FORWARDER's time zone, so keep
    # sources and forwarders in the same zone - ideally all UTC.
    KeepAlive="on"
    KeepAlive.Time="600"                  # < firewall/LB idle timeout

    queue.type="LinkedList"
    queue.filename="fwd_ama"
    queue.size="100000"
    queue.maxDiskSpace="2g"
    queue.saveOnShutdown="on"
    action.resumeRetryCount="-1"
    action.resumeInterval="10"
)
