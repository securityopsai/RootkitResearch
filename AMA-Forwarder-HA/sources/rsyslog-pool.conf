# /etc/rsyslog.d/90-ama-forwarders.conf  (Linux SOURCE hosts, rsyslog >= 8.2408.0)
#
# Check first: `rsyslogd -v`. Target arrays arrived in 8.2408.0 (Aug 2024).
# Older rsyslog (e.g. stock Ubuntu 24.04 = 8.2312, RHEL 9) fails to parse this
# file ("parameter 'target' is not a string") - use rsyslog-vip.conf instead.
#
# Sends to BOTH VIPs round-robin. The VIPs carry the cluster's health logic
# (keepalived moves them off a sick node); the pool adds source-side failover:
# an unreachable target is skipped and retried every pool.resumeInterval, and
# the action suspends only when all targets are down - then the disk-assisted
# queue below holds the backlog (up to queue.maxDiskSpace) and drains it on
# recovery. Pools require TCP; with UDP only the first target is used.

action(
    name="fwd_ama"
    type="omfwd"
    target=["10.10.20.21", "10.10.20.22"]   # VIP-A, VIP-B
    port="514"
    protocol="tcp"
    # No template override: AMA re-renders the header on the forwarder as RFC 3164
    # (no UTC offset) and interprets it in the FORWARDER's time zone, so keep
    # sources and forwarders in the same zone - ideally all UTC.
    KeepAlive="on"
    KeepAlive.Time="600"                  # < firewall/LB idle timeout
    pool.resumeInterval="30"

    # queue.filename makes the queue disk-assisted: memory first, spill to
    # disk under backlog, persisted across rsyslog restarts.
    queue.type="LinkedList"
    queue.filename="fwd_ama"
    queue.size="100000"
    queue.maxDiskSpace="2g"
    queue.saveOnShutdown="on"
    action.resumeRetryCount="-1"          # never give up
    action.resumeInterval="10"
)
