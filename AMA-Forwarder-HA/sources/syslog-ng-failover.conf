# /etc/syslog-ng/conf.d/90-ama-forwarders.conf  (Linux SOURCE hosts on syslog-ng)
#
# Client-side failover: send to VIP-A; if it is unreachable, fail over to
# VIP-B; fail back after 5 successful probes. failback() is TCP-only.
# Replace s_src with your distro's local source name
# (Debian/Ubuntu: s_src, RHEL/SUSE: s_sys). Validate: syslog-ng --syntax-only

destination d_ama_fwd {
    network("10.10.20.21"                       # VIP-A
        port(514)
        transport("tcp")
        so-keepalive(yes)
        failover(
            servers("10.10.20.22")              # VIP-B
            failback(
                tcp-probe-interval(10)
                successful-probes-required(5)
            )
        )
        disk-buffer(
            reliable(no)
            disk-buf-size(2147483648)           # 2 GiB spill-over while both VIPs are down
            dir("/var/lib/syslog-ng")
        )
    );
};

log {
    source(s_src);
    destination(d_ama_fwd);
};
