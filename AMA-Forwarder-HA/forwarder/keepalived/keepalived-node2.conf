# /etc/keepalived/keepalived.conf on amafwd02
#
# Two VIPs, active/active:
#   VIP-A 10.10.20.21  normally on amafwd01 (priority 100 here, 150 on amafwd01)
#   VIP-B 10.10.20.22  normally on amafwd02 (priority 150 here, 100 on amafwd01)
# Point half of the senders at VIP-A and half at VIP-B. If a node fails, the
# survivor owns both VIPs, so each node must be sized for 100% of peak EPS.
#
# Replace: interface name, node/VIP addresses, virtual_router_id values (must be
# unique on the L2 segment). The only difference from keepalived-node1.conf is
# router_id, unicast_src_ip/unicast_peer and the two priorities.

global_defs {
    router_id amafwd02
    enable_script_security
    script_user root
    # Re-announce the VIP MAC every 60 s in case an upstream device missed or
    # rate-limited the gratuitous ARP sent at failover.
    vrrp_garp_master_refresh 60
}

# Hard check: a node that cannot receive syslog must not hold a VIP.
vrrp_script chk_receive {
    script "/usr/local/sbin/ama-fwd-health receive"
    interval 5
    timeout 4
    fall 3          # ~15 s of failures before the VIP moves
    rise 3
}

# Soft check: AMA down lowers priority by 60, which moves the VIP to the peer
# only if the peer's AMA is healthy. If AMA is down on both nodes (for example a
# simultaneous extension upgrade), priorities stay in the same order, VIPs stay
# put, and rsyslog queues for AMA instead of the cluster going dark.
vrrp_script chk_forward {
    script "/usr/local/sbin/ama-fwd-health forward"
    interval 5
    timeout 4
    fall 6          # tolerate ~30 s of AMA restart without moving anything
    rise 3
    weight -60
}

vrrp_instance SYSLOG_VIP_A {
    state BACKUP            # both nodes start as BACKUP; priority decides
    interface ens192
    virtual_router_id 61
    priority 100
    # A backup takes over after ~3.6 s without adverts. If VM stuns from
    # snapshot backups cause false failovers, set 3 on BOTH nodes (README 7.3).
    advert_int 1
    # Delay before a higher-priority node takes the VIP. Applies both to
    # failback and to the weighted (AMA-down) case, so keep it short enough
    # that AMA's 1 GB rsyslog spool can absorb it at your EPS.
    preempt_delay 60
    unicast_src_ip 10.10.20.12
    unicast_peer {
        10.10.20.11
    }
    virtual_ipaddress {
        10.10.20.21/24 dev ens192
    }
    track_script {
        chk_receive
        chk_forward
    }
}

vrrp_instance SYSLOG_VIP_B {
    state BACKUP
    interface ens192
    virtual_router_id 62
    priority 150
    advert_int 1
    preempt_delay 60
    unicast_src_ip 10.10.20.12
    unicast_peer {
        10.10.20.11
    }
    virtual_ipaddress {
        10.10.20.22/24 dev ens192
    }
    track_script {
        chk_receive
        chk_forward
    }
}
