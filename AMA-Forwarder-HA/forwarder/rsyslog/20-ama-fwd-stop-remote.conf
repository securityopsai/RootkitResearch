# /etc/rsyslog.d/20-ama-fwd-stop-remote.conf  (forwarder nodes)
#
# Sorts after 10-azuremonitoragent-omfwd.conf, so AMA has already been handed
# the message. Stopping network-received messages here keeps the distro rules
# that come later (Ubuntu: 50-default.conf; RHEL: the RULES section of
# /etc/rsyslog.conf, which follows the rsyslog.d include) from also writing
# every firewall log line to /var/log - the "full disk" failure mode that
# Microsoft warns stops AMA.
#
# Verify the order on your distro: `rsyslogd -N1` must pass, and after a test
# message `grep <marker> /var/log/syslog /var/log/messages` must find nothing.
if $inputname == "imtcp" or $inputname == "imudp" or $inputname == "imrelp" then stop
