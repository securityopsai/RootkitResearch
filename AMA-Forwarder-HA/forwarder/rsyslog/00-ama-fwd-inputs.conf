# /etc/rsyslog.d/00-ama-fwd-inputs.conf  (forwarder nodes)
#
# Network listeners for the AMA forwarder. This replaces the imudp/imtcp lines
# that Microsoft's Forwarder_AMA_installer.py enables in /etc/rsyslog.conf.
# Load each module ONCE: if you ran the installer, delete its module()/input()
# lines for imudp/imtcp from /etc/rsyslog.conf, then run `rsyslogd -N1`.
#
# Listen on all addresses (no address= parameter) so the node accepts traffic
# on its own IP and on whichever keepalived VIP it currently owns, with no
# need for net.ipv4.ip_nonlocal_bind.
#
# Keep these inputs in the DEFAULT ruleset: AMA's forwarding rule
# (10-azuremonitoragent-omfwd.conf) is added to the default ruleset only, and
# inputs bound to other rulesets are not forwarded to AMA.

# CEF lines from some firewalls exceed rsyslog's 8 KB default and would be
# truncated. 64 KB covers them with margin (AMA itself drops rows over 1 MB).
global(maxMessageSize="64k")

# imtcp's default is 200 concurrent sessions - connections beyond that are
# refused. Set well above your TCP sender count (each node must accept ALL
# senders when its peer is down). keepAlive detects dead senders and keeps idle
# flows alive through firewalls and load balancers. keepAlive.time (seconds;
# Linux default 7200) must be below the shortest idle timeout on the path:
# on Azure LB raise the rule's idle timeout from its 4-minute default to 30.
module(load="imtcp" maxSessions="2000" keepAlive="on" keepAlive.time="600")
input(type="imtcp" port="514")

# rcvBufSize: UDP bursts that overflow the socket buffer are dropped silently
# by the kernel. See ../sysctl/90-ama-fwd.conf.
module(load="imudp")
input(type="imudp" port="514" rcvBufSize="16m")

# RELP for Linux sources (package rsyslog-relp). Application-level acks: the
# sender resends anything unacknowledged after a failover. In testing, a node
# crash + VIP takeover lost ~6 s of plain-TCP traffic and nothing over RELP.
module(load="imrelp")
input(type="imrelp" port="2514")

# rsyslog internal counters (queue depth, discards, per-action failures) every
# 60 s as facility "syslog", severity info, program "rsyslogd-pstats". Collect
# facility syslog >= info in the Syslog DCR to see them in the workspace.
module(load="impstats" interval="60" facility="5" severity="6" format="json")
