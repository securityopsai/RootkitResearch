# /etc/sysctl.d/90-ama-fwd.conf  (forwarder nodes) - apply with `sysctl --system`
#
# Allow the 16 MB UDP receive buffer requested by imudp (rcvBufSize) even if
# rsyslog runs without CAP_NET_ADMIN (Ubuntu drops rsyslog to the "syslog" user).
net.core.rmem_max = 33554432

# Watch for UDP drops with:  nstat -az UdpRcvbufErrors UdpInErrors
